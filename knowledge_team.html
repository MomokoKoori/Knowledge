<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>业务知识库 · 团队版</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#1a1d29; --muted:#8a90a6; --text-2:#5a6072;
  --primary:#3b5bdb; --primary-deep:#2b46b3; --accent:#22c3a6; --primary-soft:#eef1ff; --border:#e8eaf0;
  --danger:#e85d5d; --success:#2f9e6f; --radius:12px;
  --shadow:0 2px 12px rgba(20,24,60,.06); --shadow-lg:0 10px 34px rgba(20,24,60,.12);
  --auth-grad:linear-gradient(168deg,#141a3f 0%,#2b3a8f 42%,#4253c8 76%,#3b5bdb 100%);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; line-height:1.5;
}
.app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative;}
.app.enter{animation:appIn .32s ease both;}
@keyframes appIn{from{opacity:0; transform:translateY(8px);}to{opacity:1; transform:translateY(0);}}
/* ---- auth screen ---- */
.auth{position:fixed; inset:0; z-index:100; background:var(--auth-grad); display:flex; align-items:center; justify-content:center; padding:24px; overflow:hidden;}
.auth .abg{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
.auth .abg .ring{position:absolute; border-radius:50%; border:1px solid rgba(255,255,255,.07);}
.auth .abg .r1{width:420px; height:420px; top:-140px; right:-120px; border-width:34px;}
.auth .abg .r2{width:300px; height:300px; bottom:-110px; left:-90px; border-width:22px;}
.auth .abg .glow{position:absolute; width:200px; height:200px; border-radius:50%; background:rgba(255,255,255,.09); filter:blur(40px);}
.auth .abg .g1{top:12%; left:14%;}
.auth .abg .g2{bottom:10%; right:12%; background:rgba(34,195,166,.18);}
.auth .abox{position:relative; width:100%; max-width:360px; background:var(--card); border-radius:20px; padding:26px 22px; box-shadow:var(--shadow-lg);}
.auth .abrand{text-align:center; margin-bottom:18px;}
.auth .amark{width:52px; height:52px; margin:0 auto 12px; border-radius:15px; background:var(--auth-grad); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(43,62,143,.4); position:relative; overflow:hidden;}
.auth .amark svg{width:28px; height:28px; color:#fff;}
.auth .amark::after{content:''; position:absolute; width:60px; height:60px; border-radius:50%; background:rgba(34,195,166,.35); filter:blur(16px); top:-20px; right:-20px;}
.auth .alog{font-size:21px; font-weight:700; text-align:center; margin-bottom:5px; color:var(--text); letter-spacing:.5px;}
.auth .asub{text-align:center; font-size:12.5px; color:var(--muted); margin-bottom:20px; line-height:1.5;}
.auth .afeat{display:flex; gap:8px; justify-content:center; margin-bottom:20px; flex-wrap:wrap;}
.auth .afeat .fchip{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--text-2); background:var(--primary-soft); padding:5px 10px; border-radius:12px; font-weight:500;}
.auth .afeat .fchip .dot{width:6px; height:6px; border-radius:50%;}
.auth .afeat .fchip .dot.g{background:var(--success);}
.auth .afeat .fchip .dot.b{background:var(--primary);}
.auth .afeat .fchip .dot.a{background:var(--accent);}
.auth input{width:100%; height:48px; border:1.5px solid var(--border); border-radius:11px; padding:0 14px; font-size:15px; margin-bottom:12px; outline:none; background:#fafbfe; color:var(--text); transition:border-color .15s, box-shadow .15s; font-family:inherit;}
.auth input::placeholder{color:#aab0c0;}
.auth input:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(59,91,219,.14); background:#fff;}
.auth .abtn{width:100%; height:48px; border:none; border-radius:11px; font-size:15px; font-weight:600; cursor:pointer; margin-top:6px; transition:transform .1s, filter .15s; display:flex; align-items:center; justify-content:center; gap:8px; font-family:inherit;}
.auth .abtn:active{transform:scale(.98);}
.auth .abtn.primary{background:var(--auth-grad); color:#fff; box-shadow:0 6px 16px rgba(43,62,143,.35);}
.auth .abtn.primary:active{filter:brightness(1.1);}
.auth .abtn.ghost{background:#fff; color:var(--primary); border:1.5px solid var(--primary-soft); position:relative; overflow:hidden;}
.auth .abtn.ghost::before{content:''; position:absolute; left:0; right:0; top:0; height:0; background:var(--primary-soft); opacity:.5; transition:height .18s;}
.auth .abtn.ghost:hover::before{height:100%;}
.auth .abtn .ic{position:relative; z-index:1;}
.auth .ahint{font-size:12px; color:var(--muted); text-align:center; margin-top:14px; line-height:1.5;}
/* ---- header ---- */
header{position:sticky; top:0; z-index:20; background:rgba(245,246,248,.92); backdrop-filter:saturate(150%) blur(10px); padding:calc(env(safe-area-inset-top) + 14px) 16px 10px; box-shadow:0 1px 0 rgba(232,234,240,.9);}
.hbar{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.hbar .brand{display:flex; align-items:center; gap:9px; flex:1; min-width:0;}
.hbar .hmark{width:34px; height:34px; border-radius:10px; background:var(--auth-grad); display:flex; align-items:center; justify-content:center; flex:0 0 auto; box-shadow:0 4px 10px rgba(43,62,143,.32); position:relative; overflow:hidden;}
.hbar .hmark svg{width:19px; height:19px; color:#fff;}
.hbar .hmark::after{content:''; position:absolute; width:26px; height:26px; border-radius:50%; background:rgba(34,195,166,.4); filter:blur(8px); top:-8px; right:-8px;}
.hbar .htitle{display:flex; flex-direction:column; gap:1px; min-width:0;}
.hbar .logo{font-size:15px; font-weight:700; color:var(--text); letter-spacing:.3px; line-height:1.2;}
.hbar .hsub{font-size:10.5px; color:var(--muted); font-weight:500; letter-spacing:.4px; text-transform:uppercase;}
.hbar .team{font-size:11.5px; color:var(--primary); background:var(--primary-soft); border:1px solid rgba(59,91,219,.14); padding:4px 10px; border-radius:14px; font-weight:600; white-space:nowrap; max-width:100px; overflow:hidden; text-overflow:ellipsis;}
.hbar .status{width:8px; height:8px; border-radius:50%; background:var(--success); flex:0 0 auto; box-shadow:0 0 0 3px rgba(47,158,111,.18);}
.hbar .status.off{background:var(--muted); box-shadow:0 0 0 3px rgba(138,144,166,.15);}
.ibtn{width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); font-size:15px; font-weight:600; flex:0 0 auto; transition:background .15s, color .15s, transform .1s; position:relative;}
.ibtn:active{transform:scale(.92);}
.ibtn:hover{background:var(--primary-soft); color:var(--primary); border-color:rgba(59,91,219,.18);}
.ibtn svg{width:16px; height:16px; stroke-width:2;}
.ibtn{position:relative; z-index:5;}
.ibtn .tip{position:absolute; top:calc(100% + 7px); left:50%; transform:translateX(-50%) translateY(-4px); background:rgba(26,29,41,.96); color:#fff; font-size:10.5px; font-weight:500; padding:4px 8px; border-radius:7px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .15s, transform .15s; letter-spacing:.3px; box-shadow:0 4px 12px rgba(20,24,60,.2); z-index:60;}
.ibtn .tip::before{content:''; position:absolute; bottom:100%; left:50%; transform:translateX(-50%); border:4px solid transparent; border-bottom-color:rgba(26,29,41,.96);}
.ibtn:hover .tip{opacity:1; transform:translateX(-50%) translateY(0);}
.ibtn:hover .tip{opacity:1; transform:translateY(0);}
.ibtn.danger:hover{background:#fdf3f3; color:var(--danger); border-color:#f6dcdc;}
.search-wrap{position:relative;}
.search-wrap input{width:100%; height:48px; border:1.5px solid var(--border); border-radius:13px; background:var(--card); padding:0 44px; font-size:15px; outline:none; box-shadow:var(--shadow); color:var(--text); transition:border-color .15s, box-shadow .15s; font-family:inherit;}
.search-wrap input::placeholder{color:#aab0c0;}
.search-wrap input:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(59,91,219,.12), var(--shadow);}
.search-wrap .s-icon{position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--muted); display:flex; align-items:center;}
.search-wrap .s-icon svg{width:17px; height:17px; stroke-width:2;}
.search-wrap .s-clear{position:absolute; right:9px; top:50%; transform:translateY(-50%); width:30px; height:30px; border-radius:50%; border:none; background:var(--primary-soft); color:var(--primary); font-size:14px; cursor:pointer; display:none; align-items:center; justify-content:center;}
.tabs{display:flex; gap:8px; overflow-x:auto; padding:12px 0 4px; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto; padding:7px 14px; border-radius:20px; font-size:13px; font-weight:500; border:1px solid var(--border); background:var(--card); color:var(--muted); cursor:pointer; white-space:nowrap; transition:all .15s; font-family:inherit;}
.tab:active{transform:scale(.96);}
.tab.active{background:var(--auth-grad); color:#fff; border-color:transparent; box-shadow:0 4px 10px rgba(43,62,143,.3); font-weight:600;}
/* ---- list ---- */
main{padding:8px 16px calc(96px + env(safe-area-inset-bottom));}
.list{display:flex; flex-direction:column; gap:11px;}
.card{position:relative; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 14px 12px 18px; cursor:pointer; box-shadow:var(--shadow); transition:transform .1s, box-shadow .18s, border-color .18s; overflow:hidden; animation:cardIn .28s ease both;}
.card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--primary); opacity:0; transition:opacity .18s;}
.card:active{transform:scale(.985); box-shadow:var(--shadow-lg);}
.card:hover{border-color:rgba(59,91,219,.24);}
.card.faved::before{opacity:1; background:linear-gradient(var(--accent), var(--primary));}
@keyframes cardIn{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:translateY(0);}}
.card .c-top{display:flex; align-items:flex-start; gap:10px;}
.card .c-fav{flex:0 0 auto; width:32px; height:32px; border:none; background:transparent; cursor:pointer; padding:4px; color:#c4c8d4; font-size:19px; line-height:1; transition:transform .12s, color .15s;}
.card .c-fav:hover{color:var(--accent);}
.card .c-fav:active{transform:scale(1.25);}
.card .c-fav.on{color:var(--accent);}
.card .c-body{flex:1; min-width:0;}
.card h3{font-size:15.5px; font-weight:600; margin-bottom:5px; line-height:1.4; letter-spacing:.1px; color:var(--text);}
.card h3 mark,.card .c-sum mark{background:var(--primary-soft); color:var(--primary); border-radius:3px; padding:0 2px;}
.card .c-sum{font-size:13px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.5;}
.card .c-meta{display:flex; align-items:center; gap:6px; margin-top:10px; flex-wrap:wrap;}
.chip{display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:4px 9px; border-radius:11px; background:var(--primary-soft); color:var(--primary); font-weight:600; letter-spacing:.2px;}
.chip svg{width:11px; height:11px; stroke-width:2.2;}
.chip.tag{background:#f0f2f7; color:var(--text-2); font-weight:500; letter-spacing:.1px;}
.card .c-time{font-size:11px; color:var(--muted); margin-left:auto; white-space:nowrap;}
.empty{text-align:center; padding:64px 24px 40px; color:var(--muted);}
.empty .e-wrap{width:88px; height:88px; margin:0 auto 18px; border-radius:26px; background:var(--primary-soft); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;}
.empty .e-wrap::after{content:''; position:absolute; width:56px; height:56px; border-radius:50%; background:rgba(59,91,219,.2); filter:blur(14px); top:-14px; right:-14px;}
.empty .e-wrap svg{width:38px; height:38px; color:var(--primary); stroke-width:1.6; position:relative; z-index:1;}
.empty .e-title{font-size:15px; font-weight:600; color:var(--text-2); margin-bottom:5px;}
.empty p{font-size:13.5px;}
/* ---- fab ---- */
.fab{position:fixed; right:max(16px, calc((100vw - 480px)/2 + 16px)); bottom:calc(26px + env(safe-area-inset-bottom)); width:58px; height:58px; border-radius:18px; border:none; background:var(--auth-grad); color:#fff; font-size:26px; cursor:pointer; box-shadow:0 8px 22px rgba(43,62,143,.42); z-index:30; line-height:1; display:flex; align-items:center; justify-content:center; transition:transform .12s, box-shadow .18s;}
.fab:active{transform:scale(.92) rotate(90deg); box-shadow:0 4px 12px rgba(43,62,143,.35);}
.fab svg{width:26px; height:26px; stroke-width:2.4;}
.fab::after{content:''; position:absolute; inset:0; border-radius:18px; box-shadow:0 0 0 0 rgba(59,91,219,.4); animation:fabPulse 2.6s ease-out infinite;}
@keyframes fabPulse{0%{box-shadow:0 0 0 0 rgba(59,91,219,.35);}70%{box-shadow:0 0 0 16px rgba(59,91,219,0);}100%{box-shadow:0 0 0 0 rgba(59,91,219,0);}}
/* ---- sheet ---- */
.backdrop{position:fixed; inset:0; background:rgba(20,24,60,.32); z-index:35; opacity:0; pointer-events:none; transition:opacity .25s;}
.backdrop.on{opacity:1; pointer-events:auto;}
.sheet{position:fixed; left:0; right:0; bottom:0; background:var(--bg); z-index:40; max-width:480px; margin:0 auto; border-radius:20px 20px 0 0; box-shadow:0 -8px 30px rgba(20,24,60,.18); transform:translateY(105%); transition:transform .28s cubic-bezier(.22,.61,.36,1); max-height:calc(100vh - env(safe-area-inset-top)); overflow-y:auto;}
.sheet.open{transform:translateY(0);}
.sheet .grip{width:36px; height:4px; border-radius:2px; background:#d7dae5; margin:10px auto 4px;}
.sheet .s-head{padding:8px 18px 12px; display:flex; align-items:center; gap:12px; position:sticky; top:0; background:var(--bg); z-index:2;}
.sheet .s-head h2{font-size:16px; font-weight:600; flex:1; line-height:1.35;}
.s-btn{width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); font-size:16px;}
.s-btn.fav.on{color:var(--success); border-color:var(--success);}
.sheet .s-body{padding:6px 18px 28px;}
.sheet .s-tags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
.sheet .s-content{font-size:15px;}
.sheet .s-content p{margin-bottom:10px;}
.sheet .s-content ul{padding-left:18px; margin-bottom:10px;}
.sheet .s-content li{margin-bottom:4px;}
.sheet .s-content h1,.sheet .s-content h2,.sheet .s-content h3{font-size:16px; margin:14px 0 8px; font-weight:600;}
.sheet .s-content code{background:#f0f2f7; padding:2px 5px; border-radius:4px; font-size:13px; font-family:ui-monospace,monospace;}
.sheet .s-meta{margin-top:14px; font-size:12px; color:var(--muted);}
.sheet .s-foot{display:flex; gap:10px; padding:14px 18px; border-top:1px solid var(--border); position:sticky; bottom:0; background:var(--bg);}
.sheet .s-foot button{flex:1; height:44px; border-radius:12px; font-size:14px; font-weight:500; cursor:pointer; border:1px solid var(--border); background:var(--card); color:var(--text);}
.sheet .s-foot .save{background:var(--primary); color:#fff; border-color:var(--primary);}
.sheet .s-foot .del{color:var(--danger); border-color:#f6dcdc; background:#fdf3f3;}
/* ---- editor ---- */
.editor{display:none; flex-direction:column; gap:12px; padding:14px 18px 20px;}
.editor.on{display:flex;}
.editor input,.editor textarea{width:100%; border:1.5px solid var(--border); border-radius:11px; background:#fafbfe; padding:11px 13px; font-size:15px; outline:none; font-family:inherit; transition:border-color .15s, box-shadow .15s, background .15s;}
.editor input:focus,.editor textarea:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(59,91,219,.12); background:#fff;}
.editor textarea{min-height:120px; resize:vertical;}
.editor .row{display:flex; gap:10px;}
.editor .row > div{flex:1;}
.editor label{font-size:11.5px; color:var(--muted); display:block; margin-bottom:5px; font-weight:600; letter-spacing:.4px; text-transform:uppercase;}
.webimport{display:flex; flex-direction:column; gap:8px;}
.webimport .wi-row{display:flex; gap:8px;}
.webimport .wi-row input{flex:1; height:42px; border:1.5px solid var(--border); border-radius:11px; background:#fafbfe; padding:0 12px; font-size:14px; outline:none; font-family:inherit; min-width:0; transition:border-color .15s, box-shadow .15s;}
.webimport .wi-row input:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(59,91,219,.12); background:#fff;}
.webimport .wi-btn{flex:0 0 auto; width:64px; height:42px; border:none; border-radius:11px; background:var(--auth-grad); color:#fff; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px; box-shadow:0 4px 10px rgba(43,62,143,.28); font-family:inherit; transition:transform .1s, filter .15s;}
.webimport .wi-btn:active{transform:scale(.95);}
.webimport .wi-btn:disabled{opacity:.6; cursor:default;}
.webimport .wi-btn svg{width:14px; height:14px; stroke-width:2.2;}
.webimport .wi-sub{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted);}
.webimport .wi-sub button{border:none; background:none; color:var(--primary); font-size:12px; font-weight:500; cursor:pointer; padding:0; font-family:inherit;}
.webimport .wi-sub button:hover{text-decoration:underline;}
.webimport .wi-sub span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.webimport .wi-sec{margin-top:6px; background:#f7f8fc; border:1px solid var(--border); border-radius:11px; padding:10px; max-height:220px; overflow-y:auto;}
.webimport .wi-sec-h{font-size:11.5px; font-weight:600; color:var(--text-2); margin-bottom:8px; letter-spacing:.3px;}
.webimport .wi-sec-list{display:flex; flex-direction:column; gap:6px;}
.webimport .wi-sec-item{display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; user-select:none;}
.webimport .wi-sec-item input{width:16px; height:16px; flex:0 0 auto; accent-color:var(--primary); cursor:pointer;}
.webimport .wi-sec-item .sec-t{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text);}
.webimport .wi-sec-item .sec-len{font-size:11px; color:var(--muted); flex:0 0 auto;}
.webimport .wi-sec-act{margin-top:10px; display:flex; gap:8px; align-items:center;}
.webimport .wi-btn.small{flex:0 0 auto; width:auto; height:34px; padding:0 14px; font-size:12.5px; border-radius:9px;}
/* detail: source link */
.s-src{margin-top:10px; padding:8px 10px; background:var(--primary-soft); border-radius:10px; font-size:12.5px; color:var(--primary); display:flex; align-items:center; gap:7px; text-decoration:none; min-width:0;}
.s-src svg{width:15px; height:15px; flex:0 0 auto; stroke-width:2;}
.s-src .s-src-t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
/* ---- modal / toast / syncbanner ---- */
.modal{position:fixed; inset:0; background:rgba(20,24,60,.45); z-index:70; display:none; align-items:center; justify-content:center; padding:24px;}
.modal.on{display:flex;}
.modal .mbox{background:var(--card); border-radius:16px; padding:22px; width:100%; max-width:340px; box-shadow:var(--shadow);}
.modal h3{font-size:16px; font-weight:600; margin-bottom:8px;}
.modal p{font-size:13px; color:var(--muted); margin-bottom:16px;}
.modal .mrow{display:flex; gap:10px;}
.modal .mrow button{flex:1; height:44px; border-radius:11px; font-size:14px; font-weight:500; cursor:pointer; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; transition:transform .1s;}
.modal .mrow button:active{transform:scale(.97);}
.modal .mrow .ok{background:var(--auth-grad); color:#fff; border-color:transparent; box-shadow:0 4px 12px rgba(43,62,143,.3);}
.toast{position:fixed; left:50%; bottom:calc(104px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(12px); background:rgba(26,29,41,.94); color:#fff; padding:10px 18px; border-radius:22px; font-size:13px; z-index:80; opacity:0; pointer-events:none; transition:all .25s; white-space:nowrap; box-shadow:0 8px 24px rgba(20,24,60,.24);}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
.syncbanner{display:none; background:linear-gradient(90deg,#fff6e0,#fffbea); color:#8a6d1f; font-size:12px; font-weight:500; text-align:center; padding:8px 12px; border-bottom:1px solid #f3e3b8; letter-spacing:.2px; align-items:center; gap:8px; justify-content:center;}
.syncbanner.on{display:flex;}
.syncbanner .sb-ic{display:inline-flex; flex:0 0 auto;}
.syncbanner .sb-ic svg{width:14px; height:14px; animation:sbSpin 1.6s linear infinite;}
.syncbanner .sb-txt{min-width:0;}
@keyframes sbSpin{to{transform:rotate(360deg);}}
</style>

<body>


<!-- login -->
<div class="auth" id="auth" style="display:none">
  <div class="abg" aria-hidden="true">
    <div class="ring r1"></div><div class="ring r2"></div>
    <div class="glow g1"></div><div class="glow g2"></div>
  </div>
  <div class="abox">
    <div class="abrand">

<script>
/* ================= CONFIG（部署时填这两项） ================= */
const SUPABASE_URL = "https://fowpxibytlglboejspae.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvd3B4aWJ5dGxnbGJvZWpzcGFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MTc0NzYsImV4cCI6MjEwNzE5MzQ3Nn0.b6PyoHwRqrWp7eEOFGQibyO5JMsLNb8LOYtAfoh2duw";
// 团队统一入口：新成员自动加入这个团队
const TEAM_ID = "776b7a23-7092-4a2a-b296-581850104dbc";
/* ============================================================ */

let supa = null;
let session = null, teamId = null, teamName = '团队';
let entries = [];           // 当前团队全部条目（内存缓存）
let pending = [];           // 离线时暂存的写操作 {op,data,id}
let activeCat = '全部';
let currentId = null;
let realTimeSub = null;

const LS_OFF = 'kb_offline_sync_v2';

/* ---------- init supabase ---------- */
async function init(){
  if(!SUPABASE_URL.includes('YOUR_PROJECT_REF')){
    try{
      if(!window.supabase){ throw new Error('supabase lib not loaded'); }
      supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }catch(err){
      document.getElementById('loginHint').textContent='库未加载：'+err.message;
      document.getElementById('auth').style.display='flex';
      toast('Supabase 库未加载，请检查网络后刷新');
      return;
    }
  }
  // 载入离线暂存
  pending = JSON.parse(localStorage.getItem(LS_OFF)||'[]');
  bindEvents();
  watchNet();
  if(supa){
    const { data } = await supa.auth.getSession();
    session = data.session;
    console.log('[boot] getSession', data.session?('OK '+data.session.user.email):'none (需登录)');
    if(data.session){ onAuthed(); }
    else { showAuth(); }
    // 兜底：若 session 因 token 刷新瞬时为 null，5 秒后重取一次
    setTimeout(async()=>{
      try{
        if(!session && supa){
          const g=await supa.auth.getSession();
          if(g.data.session){ session=g.data.session; onAuthed(); console.log('[boot] 延迟恢复 session'); }
        }
      }catch(e){ console.log('[boot] 延迟取 session 失败', e); }
    },5000);
    supa.auth.onAuthStateChange((_e,s)=>{
      session=s;
      if(s&&s.user){ if(!document.getElementById('app').style.display || document.getElementById('app').style.display==='none') onAuthed(); }
      else { showAuth(); }
    });
  } else {
    // 未配置 supabase：退回纯本地模式
    showAuth();
    document.getElementById('loginHint').textContent='未配置后端，使用本地模式';
    document.getElementById('loginBtn').textContent='进入本地模式';
  }
}
function showAuth(){document.getElementById('auth').style.display='flex';document.getElementById('app').style.display='none';}
function onAuthed(){var appEl=document.getElementById('app');appEl.classList.remove('enter');void appEl.offsetWidth;appEl.classList.add('enter');document.getElementById('auth').style.display='none';appEl.style.display='block';loadTeam();}

async function login(){
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('pass').value;
  if(!email||!pass){toast('请填写邮箱和密码');return;}
  if(!supa){ onAuthed(); return; }   // 本地模式
  const hint=document.getElementById('loginHint');
  hint.textContent='登录中…';
  const {data,err}=await supa.auth.signInWithPassword({email,password:pass});
  if(!err){
    // 登录成功
    session=data.session; onAuthed();
    setTimeout(function(){ refreshStatusLine(); },1000);
    return;
  }
  // 登录失败：判断是不是"账号不存在" → 走注册
  const isNoUser=/Invalid login credentials|Invalid Login|does not exist/i.test(err.message);
  if(isNoUser){
    hint.textContent='首次使用，正在注册…';
    const r2=await supa.auth.signUp({email,password:pass});
    if(r2.error){ hint.textContent='注册失败：'+r2.error.message; toast('注册失败：'+r2.error.message); }
    else {
      // 注册成功但需邮箱验证：明确引导
      hint.textContent='注册成功！请去邮箱收验证邮件，点链接后回来重新登录';
      toast('请去邮箱验证，再登录');
      // 30 秒后自动重试登录（验证完回来可直接进）
      setInterval(async()=>{
        try{
          const chk=await supa.auth.signInWithPassword({email,password:pass});
          if(!chk.error){ session=chk.data.session; onAuthed(); toast('验证完成，已登录'); refreshStatusLine(); }
        }catch(e){}
      },30000);
    }
  } else {
    // 账号存在但密码错 / 未验证等
    hint.textContent='登录失败：'+err.message;
    toast('登录失败：'+err.message);
  }
}

async function loadTeam(){
  if(!supa){ teamId='local'; teamName='本地模式'; renderAll(); return; }
  if(!session||!session.user){
    // 登录态瞬时为空：持续轮询恢复（最多 60 秒），覆盖手机网络波动
    if(window.__teamRetry){ return; }   // 防重入
    window.__teamRetry=true;
    var tries=0;
    var timer=setInterval(async()=>{
      tries++;
      try{
        var g=await supa.auth.getSession();
        if(g.data.session){ session=g.data.session; clearInterval(timer); window.__teamRetry=false; loadTeam(); }
      }catch(e){}
      if(tries>=12){ clearInterval(timer); window.__teamRetry=false; toast('登录态恢复超时，请刷新'); }
    },5000);
    toast('登录态未就绪，自动恢复中…');
    return;
  }
  const myId=session.user.id;
  // 1) 我已在某团队 → 直接用
  const {data}=await supa.from('team_members').select('teams(name),team_id').eq('user_id',myId).limit(1);
  if(data&&data[0]&&data[0].team_id){
    teamId=data[0].team_id; teamName=(data[0].teams&&data[0].teams.name)||'团队';
    finishTeam(); return;
  }
  // 2) 没团队：加入固定团队 TEAM_ID（团队成员统一进这里）；找不到再回退
  const {data:match}=await supa.from('teams').select('id,name').eq('id',TEAM_ID).limit(1);
  if(match && match[0]){
    teamId=match[0].id; teamName=match[0].name||'团队';
    const ins=await supa.from('team_members').insert({team_id:teamId,user_id:myId,role:'member'}).maybeSingle();
    if(ins.error) console.log('[loadTeam] 加入团队失败', ins.error.message);
    finishTeam(); return;
  }
  // 2b) 固定团队不存在：找「默认团队」或成员最多的
  const {data:allTeams}=await supa.from('teams').select('id,name');
  if(allTeams && allTeams.length){
    let target=allTeams.find(t=>t.name==='业务知识库') || allTeams[0];
    teamId=target.id; teamName=target.name||'团队';
    const ins=await supa.from('team_members').insert({team_id:teamId,user_id:myId,role:'member'}).maybeSingle();
    if(ins.error) console.log('[loadTeam] 加入团队失败', ins.error.message);
    finishTeam(); return;
  }
  // 3) 一个团队都没有：新建
  const {data:tm,error:te}=await supa.from('teams').insert({name:'业务知识库'}).select('id').maybeSingle();
  if(tm && tm.id){
    teamId=tm.id; teamName='业务知识库';
    await supa.from('team_members').insert({team_id:teamId,user_id:myId,role:'owner'}).maybeSingle();
    finishTeam();
  } else {
    console.log('[loadTeam] 建团队失败', te);
    toast('无法加入团队：'+(te?te.message:'未知'));
  }
}
function finishTeam(){
  if(!teamId){ toast('团队初始化失败，请刷新'); return; }
  document.getElementById('teamName').textContent=teamName;
  fetchAll(); subscribeRealtime();
  refreshStatusLine();
}
function refreshStatusLine(){
  var el=document.getElementById('statusLine');
  if(!el) return;
  var ok=(session&&session.user)&&(teamId&&teamId!=='null');
  if(ok){ el.style.display='none'; }
  else{ el.style.display='inline'; el.textContent='未同步: session='+ (ok?'ok':'?'); }
}
setInterval(refreshStatusLine,3000);

/* ---------- fetch + realtime ---------- */
async function fetchAll(){
  if(!supa){ // 本地模式：从离线缓存还原
    entries = JSON.parse(localStorage.getItem('kb_local_v2')||'[]');
    renderAll(); return;
  }
  const {data,error}=await supa.from('knowledge').select('*').eq('team_id',teamId).order('updated_at',{ascending:false});
  if(!error){ entries = (data||[]).map(norm); renderAll(); }
  else toast('加载失败：'+error.message);
}
function norm(r){ return { id:r.id, team_id:r.team_id, title:r.title, category:r.category,
  tags:r.tags||[], content:r.content||'', source_url:r.source_url||'', is_fav:!!r.is_fav, created_at:r.created_at, updated_at:r.updated_at }; }

function subscribeRealtime(){
  if(!supa||!realTimeSub) return;
  realTimeSub = supa.channel('kb_'+teamId)
    .on('postgres_changes',{event:'*',schema:'public',table:'knowledge',filter:'team_id='+teamId},
       payload=>applyRemote(payload))
    .subscribe();
}
function applyRemote(payload){
  if(payload.eventType==='INSERT'){ const n=norm(payload.new); const i=entries.findIndex(e=>e.id===n.id); if(i>=0)entries[i]=n;else entries.unshift(n); }
  else if(payload.eventType==='UPDATE'){ const i=entries.findIndex(e=>e.id===payload.new.id); if(i>=0)entries[i]=norm(payload.new); }
  else if(payload.eventType==='DELETE'){ const i=entries.findIndex(e=>e.id===payload.old.id); if(i>=0)entries.splice(i,1); }
  renderAll();
}

/* ---------- write ops（在线写库 + 离线暂存） ---------- */
async function opInsert(rec){
  rec.team_id = rec.team_id || teamId;
  const op={op:'insert',data:rec};
  let sent=false;
  if(supa && navigator.onLine && teamId && teamId!=='local'){
    const r=await supa.from('knowledge').insert(rec);
    if(!r.error){ sent=true; toast('已创建并同步'); }
    else { console.log('[opInsert] 写库失败', r.error.message); toast('保存失败：'+r.error.message); }
  }
  if(!sent){ entries.push(rec); saveLocal(); pending.push(op); toast('暂存本地，联网后自动同步'); }
  renderAll();
}
async function opUpdate(id,patch){
  const rec=entries.find(e=>e.id===id); if(!rec)return;
  Object.assign(rec,patch);
  const patchBody={title:rec.title,category:rec.category,tags:rec.tags,content:rec.content};
  let sent=false;
  if(supa && navigator.onLine){
    const r=await supa.from('knowledge').update(patchBody).eq('id',id);
    if(!r.error){ sent=true; toast('已更新并同步'); }
  }
  if(!sent){ saveLocal(); pending.push({op:'update',id,patch:patchBody}); toast('暂存本地，联网后自动同步'); }
  renderAll();
}
async function opDelete(id){
  if(supa && !isOffline()){
    const {error}=await supa.from('knowledge').delete().eq('id',id);
    if(error) toast('删除失败：'+error.message); else toast('已删除并同步');
  } else {
    pending.push({op:'delete',id}); entries=entries.filter(e=>e.id!==id); saveLocal(); toast('已离线删除，联网后同步');
  }
  currentId=null; closeDetail(); renderAll();
}
function opFav(id){
  const rec=entries.find(e=>e.id===id); if(!rec)return;
  rec.is_fav=!rec.is_fav;
  if(supa && !isOffline()){ supa.from('knowledge').update({is_fav:rec.is_fav}).eq('id',id).then(({error})=>{if(error)toast('收藏同步失败');}); }
  else { saveLocal(); pending.push({op:'fav',id,fav:rec.is_fav}); }
  renderAll();
}

/* ---------- offline flush ---------- */
async function flushPending(){
  if(!supa||!pending.length) return;
  const ops=pending.slice(); pending=[];
  for(const op of ops){
    let ok=false;
    if(op.op==='insert'){ op.data.id=op.data.id||crypto.randomUUID(); const r=await supa.from('knowledge').insert(op.data); console.log('[flush] insert',op.data.title,r.error?('err:'+r.error.message):'ok'); ok=!r.error; }
    else if(op.op==='update'){ const {error}=await supa.from('knowledge').update(op.patch).eq('id',op.id); ok=!error; }
    else if(op.op==='delete'){ const {error}=await supa.from('knowledge').delete().eq('id',op.id); ok=!error; }
    else if(op.op==='fav'){ const {error}=await supa.from('knowledge').update({is_fav:op.fav}).eq('id',op.id); ok=!error; }
    if(!ok){ pending.unshift(op); break; }  // 中断则保留剩余
  }
  savePending();
  if(!pending.length) toast('离线改动已同步');
  fetchAll();
}

/* ---------- markdown / helpers ---------- */
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(src){
  const lines=esc(src).split(/\r?\n/); let html='',inL=false,inO=false;
  const close=()=>{if(inL){html+='</ul>';inL=false;}if(inO){html+='</ol>';inO=false;}};
  const inline=t=>t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  for(let raw of lines){const l=raw.trim();if(l===''){close();continue;}let m;
    if(m=l.match(/^###\s+(.*)/)){close();html+='<h3>'+inline(m[1])+'</h3>';continue;}
    if(m=l.match(/^##\s+(.*)/)){close();html+='<h2>'+inline(m[1])+'</h2>';continue;}
    if(m=l.match(/^#\s+(.*)/)){close();html+='<h1>'+inline(m[1])+'</h1>';continue;}
    if(m=l.match(/^[-*]\s+(.*)/)){if(inO)close();if(!inL){html+='<ul>';inL=true;}html+='<li>'+inline(m[1])+'</li>';continue;}
    if(m=l.match(/^\d+[.)]\s+(.*)/)){if(inL)close();if(!inO){html+='<ol>';inO=true;}html+='<li>'+inline(m[1])+'</li>';continue;}
    close();html+='<p>'+inline(l)+'</p>';}
  close();return html;
}
function summarize(s){return (s||'').replace(/[#>*`\n]/g,' ').replace(/\s+/g,' ').trim().slice(0,80);}
function fmtTime(ts){if(!ts)return'';const d=new Date(ts),now=new Date();
  if(d.toDateString()===now.toDateString())return'今天 '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  if(d.getFullYear()===now.getFullYear())return(d.getMonth()+1)+'月'+d.getDate()+'日';
  return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();}
function hl(text,q){if(!q)return esc(text);const e=esc(text);const s=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return e.replace(new RegExp('('+s+')','gi'),'<mark>$1</mark>');}
function escAttr(s){return (s||'').replace(/"/g,'&quot;');}
function allCats(){const s=new Set();entries.forEach(e=>{if(e.category&&e.category!=='其他')s.add(e.category);});return['全部',...s];}

  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;renderAll();});

  list.sort((a,b)=>(b.is_fav?1:0)-(a.is_fav?1:0)||(new Date(b.updated_at).getTime()-new Date(a.updated_at).getTime()));
  return list;

function exportJson(){

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kb_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('已导出');

function importJson(file){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);const list=Array.isArray(d)?d:d.entries;if(!Array.isArray(list))throw 0;
    let n=0;list.forEach(e=>{if(!e.title)return;const ex=entries.find(x=>x.id===e.id);
      if(ex)Object.assign(ex,{title:e.title,category:e.category,tags:e.tags||[],content:e.content,updated_at:e.updated_at||new Date().toISOString()});
      else{entries.push({id:e.id||crypto.randomUUID(),team_id:teamId,title:e.title,category:e.category||'其他',tags:e.tags||[],content:e.content||'',is_fav:!!e.is_fav,created_at:e.created_at||new Date().toISOString(),updated_at:e.updated_at||new Date().toISOString()});n++;}});
    saveLocal();renderAll();toast('导入完成，本地新增 '+n+' 条');
  }catch(e){toast('文件格式不正确');}};
  r.readAsText(file);
}

async function fetchWebPage(){

      }

      toast('抓取失败，可改用手动粘贴');
    }
  }catch(e){
    __lastSections=[];
    status.style.color='var(--danger)'; status.textContent='网络错误：'+(e.message||'无法连接');
    toast('抓取失败，请检查网络或改用手动粘贴');

}

// 手动粘贴兜底：把用户复制来的 HTML/纯文本清洗成规整 Markdown
async function pasteWebContent(){

    var clip=await navigator.clipboard.readText();

  }
}

// 把粘贴进来的 HTML/纯文本规整成简洁 Markdown（剥掉 script/style/多余标记）
function cleanHtmlToMd(src){
  if(!src) return '';
  var isHtml=/<[a-z][\s\S]*>/i.test(src);
  var doc=new DOMParser().parseFromString(isHtml?'<div>'+src+'</div>':'<div>'+src.replace(/\n/g,'<br>')+'</div>','text/html');
  doc.querySelectorAll('script,style,nav,aside,form,button,select,input,iframe,noscript,svg,video,audio,header,footer').forEach(function(n){n.remove();});
  var out='';
  doc.querySelector('div').childNodes.forEach(function(node){
    if(node.nodeType===3){ var t=node.textContent.replace(/\s+/g,' ').trim(); if(t) out+=t+'\n'; }
    else if(node.nodeType===1){
      var tag=node.tagName.toUpperCase();
      var txt=node.textContent.replace(/\s+/g,' ').trim();
      if(!txt) return;
      if(/^H[1-6]$/.test(tag)){ out+='#'.repeat(parseInt(tag[1],10))+' '+txt+'\n'; }
      else if(tag==='LI'){ out+='- '+txt+'\n'; }
      else if(tag==='BR'){} else if(tag==='IMG'){ /* 忽略图片 */ }
      else { out+=txt+'\n'; }
    }
  });
  return out.replace(/\n{3,}/g,'\n\n').trim();
}

    out.textContent+='尝试 fetch Supabase 根: ';

    catch(e2){ out.textContent+='根也异常: '+e2.message+'\n'; }
  }
  try{

  }catch(e){ out.textContent+='异常: '+e.message+'\n'; }
};

/* ---------- boot ---------- */
function reportStatusText(){ return 'supa='+(!!supa)+' session='+(!!(session&&session.user))+' user='+(session&&session.user?session.user.email:'-')+' teamId='+(teamId||'null')+' online='+(navigator.onLine)+' pending='+(pending.length); }
function reportStatus(){
  var hint=document.getElementById('loginHint');
  if(hint && document.getElementById('auth').style.display!=='none'){ hint.textContent='状态: '+reportStatusText(); }
}
async function waitSupaLib(){
  var t=0,max=20000;
  while(t<max){
    if(window.supabase && window.supabase.createClient) return true;
    await new Promise(r=>setTimeout(r,500)); t+=500;
    var hint=document.getElementById('loginHint');
    if(hint && document.getElementById('auth').style.display!=='none') hint.textContent='加载 Supabase 库中…'+Math.round(t/1000)+'s';
  }
  return false;
}
window.addEventListener('DOMContentLoaded',async function(){
  await waitSupaLib();
  await init();
});
</script>
